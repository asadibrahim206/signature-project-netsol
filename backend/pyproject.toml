[project]
name = "signature-project"
version = "0.1.0"
description = "Signature detection and verification API"
readme = "README.md"
authors = [
    { name = "Asad Ibrahim", email = "142805001+asadibrahim206@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.1",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
    "pymupdf>=2.1",
    "python-multipart>=0.0.33",
    "timm>=1.0.31",
    "torch>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
signature-project = "signature_project:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
